<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Revolutionize Guest Services with Our Hotel Management System"
    />
    <link rel="icon" href="ICON ORANGE.ico" type="image/x-icon" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Eazotel Dashboard</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("eazotel_color_mode");
          if (
            mode === "dark" ||
            (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script
      async
      defer
      crossorigin="anonymous"
      src="https://connect.facebook.net/en_US/sdk.js"
    ></script>

    <script>
      // SDK initialization
      window.fbAsyncInit = function () {
        FB.init({
          appId: "", // your app ID goes here
          autoLogAppEvents: true,
          xfbml: true,
          version: "v26.0", // Graph API version goes here
        });
      };

      // Session logging message event listener
      window.addEventListener("message", (event) => {
        if (!event.origin.endsWith("facebook.com")) return;
        try {
          const data = JSON.parse(event.data);
          if (data.type === "WA_EMBEDDED_SIGNUP") {
            console.log("message event: ", data); // remove after testing
            // your code goes here
          }
        } catch {
          console.log("message event: ", event.data); // remove after testing
          // your code goes here
        }
      });

      // Response callback
      // const fbLoginCallback = (response) => {
      //   if (response.authResponse) {
      //     const code = response.authResponse.code;
      //     console.log("response: ", code); // remove after testing
      //     // your code goes here
      //   } else {
      //     console.log("response: ", response); // remove after testing
      //     // your code goes here
      //   }
      // };

      window.fbLoginCallback = (response) => {
        if (response.authResponse) {
          const code = response.authResponse.code;

          console.log("WhatsApp signup authorization code:", code);

          // Send this code to your backend for OAuth token exchange.
        } else {
          console.log("Facebook login response:", response);
        }
      };

      // Launch method and callback registration
      // const launchWhatsAppSignup = () => {
      //   FB.login(fbLoginCallback, {
      //     config_id: "<CONFIGURATION_ID>", // your configuration ID goes here
      //     response_type: "code",
      //     override_default_response_type: true,
      //     extras: {
      //       setup: {},
      //     },
      //   });
      // };

      window.launchWhatsAppSignup = () => {
        if (!window.FB) {
          console.error("Facebook SDK is not loaded yet");
          return;
        }

        window.FB.login(window.fbLoginCallback, {
          config_id: "",
          response_type: "code",
          override_default_response_type: true,
          extras: {
            setup: {},
            featureType: "whatsapp_business_app_onboarding", // set to 'whatsapp_business_app_onboarding'
            sessionInfoVersion: "3",
          },
        });
      };
    </script>
  </body>
</html>
